<!DOCTYPE html>
<html lang="en">
  <head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@900&amp;display=block" rel="stylesheet">
<style>
:root { --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); }
html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #FFE3EC;
  touch-action: none; user-select: none; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
canvas#game { position: fixed; left: 0; top: 0; display: block; touch-action: none; outline: none; }
#loader { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
  background: linear-gradient(#FFE3EC, #FFF4E0); z-index: 10; transition: opacity .3s; }
#loader .blob { width: 84px; height: 84px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #FFF4F8 45%, #E8C9D6);
  border: 3px solid #d7a9bd; animation: sq 0.9s ease-in-out infinite; }
@keyframes sq { 0%,100% { transform: scale(1.1, 0.9) translateY(10px); } 50% { transform: scale(0.92, 1.08) translateY(-24px); } }
</style>
<script type="module" crossorigin="" src="https://3507686-336815138426462615.preview.editmysite.com/uploads/b/139890129-696091109708213303/files/ats/index-CBS5s_WQ.js"></script>
</head>
<body>
<canvas id="game"></canvas>
<div id="loader"><div class="blob"></div></div>
</body>
</html>
