    <script type="text/javascript">
        var DEFAULT_PROGRESS = {};
        DEFAULT_PROGRESS["sound"] = 1;
        DEFAULT_PROGRESS["music"] = 1;
        DEFAULT_PROGRESS["gems"] = 10;
        DEFAULT_PROGRESS["lives"] = 3;
        DEFAULT_PROGRESS["eggs"] = 0;
        DEFAULT_PROGRESS["kills"] = 0;
        DEFAULT_PROGRESS["coins"] = 800;
        DEFAULT_PROGRESS["max_coins"] = 800;
        DEFAULT_PROGRESS["merge_level"] = 0;
        DEFAULT_PROGRESS["merge_spawns"] = 0;
        DEFAULT_PROGRESS["barricade_level"] = 0;
        DEFAULT_PROGRESS["production_level"] = 0;
        DEFAULT_PROGRESS["reduction_level"] = 0;
        DEFAULT_PROGRESS["damage_level"] = 0;
        DEFAULT_PROGRESS["egg_level"] = 0;
        DEFAULT_PROGRESS["levelskey"] = 0;
        DEFAULT_PROGRESS["merge_state"] = "";
        DEFAULT_PROGRESS["achievements"] = "";
        DEFAULT_PROGRESS["freecoins"] = -1;
        DEFAULT_PROGRESS["freegems"] = -1;
        DEFAULT_PROGRESS["freespawn"] = -1;
        DEFAULT_PROGRESS["time_stamp"] = -1;
        DEFAULT_PROGRESS["tutorial"] = 1;
        DEFAULT_PROGRESS["lang"] = "en";
        var gameSettings = {
            platform:PLATFORMs.PLAY_GAMA,
            gameEngine:GAME_ENGINEs.CONSTRUCT_2,
            defaultProgress:DEFAULT_PROGRESS,
            canvas:
            {
                width:1920,
                height:1188,
                rescaleMode:RESCALE_MODEs.MAX,
                orientation:ORIENTATIONs.LANDSCAPE
            },
            storage: {
                prefix:"cm2_"
            },
            loading:
            {
                spinner:
                {
                    type:SPINNERs.CHARACTER,
                    domId:"bg_loading_spinner_dom",
                    hideOn:"loading_end"
                },
                bar:
                {
                    type:LOADING_BARs.DEFAULT,
                    domId:"bg_loading_bar_dom",
                    frameHeight:"22px",
                    barImage:"linear-gradient(to bottom, rgba(251,176,64,1) 0%,rgba(251,176,64,1) 75%,rgba(190,129,61,1) 76%, rgba(190,129,61,1) 100%)"
                }
            },
            ads:
            {
                skipFirstInterstitial:true
            },
            localization:
            {
                langs: ["en","fr","es","it","pt","de","ru"],
                dropDown:
                {
                    domId:"bg_lang_dropdown_dom",
                    type:LANG_DROP_DOWNs.DEFAULT,
                    nickNames:true
                }
            },
            progressionBar:
            {
                alignment:"center",
                texts:
                {
                    left:false,right:false
                },
                styles:
                {
                    frameHeight:"12px",
                    barColor:"rgba(255,216,2,1)"
                },
                domId:"bg_progression_bar_dom"
            }
        };
        var GameFunctions = {
            getCustomHTML:function(event)
            {
                addHTML = '';
                if(event=="character")
                {
                    addHTML = '<div class="chicken loading_atlas atlas_chicken"></div>'+
                        '<div class="weapon loading_atlas atlas_weapon"></div>';
                }
                return addHTML;
            },
            FetchDomElements:function(){},
            onLoadingStarted:function()
            {
                BeedoGames.onGameFunctionsCallable();
                c2_callFunction("Set_NavLanguage",[userLang]);
                BeedoGames.LoaderManager.SetComponentVisible(COMPONENTs.LOADING_SPINNER,false,true);
            },
            onGameProgress(progress){},
            onLoadingEnded:function(){
            },
            onGameReady:function(){},
            onPageReady:function(){},
            onInAppsReady:function(){
                if(inAppItems==null){return};
                c2_callFunction("Enable_InApps");
                c2_callFunction("On_InApp_Prices",[BeedoGames.InAppsManager.params.priceTexts]);
            },
            onInAppsDisabled:function(){
                if(inAppItems==null){return};
                c2_callFunction("Disable_InApps");
            },
            onInAppStatus:function(id,success){
                if(inAppItems==null){return};
                if(success){c2_callFunction("On_InApp_Success",[id]);}
                else{c2_callFunction("On_InApp_Failed");}
            },
            onPurchasesReady:function(key){
                if(inAppItems==null){return};
                c2_callFunction("Set_PendingInApps",[key]);
            },
            Resize:function()
            {
                var canvasParams = BeedoGames.params.canvas;
                if(FLAGs.MOBILE)
                {
                    switch(canvasParams.orientation)
                    {
                        case ORIENTATIONs.LANDSCAPE:
                        break;
                    }
                }
            },
            SendInitialProgressToGame: function()
            {
                if(userProgress["merge_state"]!=""){
                    userProgress["tutorial"]=0;
                }
                var progress = [];
                Object.entries(userProgress).forEach(([key, value]) => {
                    progress.push(value);
                });
                c2_callFunction("On_ProfileRetrieved", progress);
            },
            onInterstitialAdEnded:function(status)
            {
                c2_callFunction("On_Ad_Served");
            },
            onRewardedAdEnded:function(status)
            {
                if(status==AD_STATUS.COMPLETED)
                {
                    c2_callFunction("On_RewardedAd_Served");
                    c2_callFunction("onRewardedAD_Peloaded");
                }
                else
                {
                    c2_callFunction("On_RewardedAd_Closed");
                    c2_callFunction("onRewardedAD_Peloaded");
                }
            },
            onLanguageSelected:function()
            {
                if(gameScene!=""){c2_callFunction("Play_aUISfx",["tap"]);}
            },
            onLanguageUpdated:function(lang)
            {
                if(gameScene!="")
                {
                    c2_callFunction("Set_Language",[lang]);
                    SaveProp("lang",lang);
                }
            },
            onSDKEvent:function(event)
            {
                switch(event)
                {
                    case "GAME_PAUSE":
                    break;
                    case "SUS-PEND": // Избегаем конфликта парсера
                    case "SUSPEND":
                    if(FLAGs.GAME_FUNCTIONS_CALLABLE){c2_callFunction("IF_FreezeGame");}
                    break;
                    case "RESUME":
                    if(FLAGs.GAME_FUNCTIONS_CALLABLE){c2_callFunction("IF_UnFreezeGame");}
                    break;
                    case "ON_AUDIO_SUSPEND":
                    if(FLAGs.GAME_FUNCTIONS_CALLABLE){c2_callFunction("IF_MuteAudio");}
                    break;
                    case "ON_AUDIO_RESUME":
                    if(FLAGs.GAME_FUNCTIONS_CALLABLE){c2_callFunction("IF_UnMuteAudio");}
                    break;
                }
            }
        };
        BeedoGames.Init(gameSettings);
        function SaveProp(id, value)
        {
            BeedoGames.ProfileManager.SetItem(id,value);
        }
        function SaveCustomProps(time_stamp,coins,max_coins)
        {
            BeedoGames.ProfileManager.SetItems({
                time_stamp: time_stamp,
                coins: coins,
                max_coins: max_coins
            });
        }
    </script>
    <script type="text/javascript">
        var gameStarted=false;
        function onLoadingStarted()
        {
            document.body.style.background  = "#000";
            if(!FLAGs.LOADING_STARTED){BeedoGames.LoaderManager.onLoadingStarted();}
        }
        function Update_LoadingProgress(progress)
        {
            BeedoGames.LoaderManager.onGameProgress(progress);
        }
        function onGameStarted()
        {
            BeedoGames.onGameReady();
            if(BeedoGames.AdsManager.adBlocker){
                c2_callFunction("onRewardedAD_Disabled");
            }
            if (navigator.userActivation.hasBeenActive||FLAGs.FIRST_INTERACTION){
                c2_callFunction("User_Interacted");
            }
        }
        function onSceneLoaded (sceneName)
        {
            var displayBar = false;
            gameScene = sceneName;
            switch(gameScene)
            {
                case "loaderlayout":
                break;

                case "gamelayout":
                displayBar = true;
                break;
            }
            if(displayBar)
            {
                BeedoGames.ProgressionBar.SetVisible(true);
                BeedoGames.LanguageManager.SetComponentVisible(COMPONENTs.DROP_DOWN,true);
            }
            else
            {
                BeedoGames.ProgressionBar.SetVisible(false);
                BeedoGames.LanguageManager.SetComponentVisible(COMPONENTs.DROP_DOWN,false);
            }
        }
        function onStartGameCalled()
        {
            gameStarted = true;
        }
        function onEndGameCalled()
        {
            gameStarted = false;
        }
        function onScreenDisplayed(id)
        {
            BeedoGames.ProgressionBar.SetVisible(false);
            BeedoGames.LanguageManager.SetComponentVisible(COMPONENTs.DROP_DOWN,false);
            if(id=="merge"){}
        }
        function onScreenClosed(id)
        {
            BeedoGames.ProgressionBar.SetVisible(true);
            BeedoGames.LanguageManager.SetComponentVisible(COMPONENTs.DROP_DOWN,true);
        }
        function onMatchStarted() {
            BeedoGames.onEvent(EVENTs.GAME_START);
            if(gameScene=="gamelayout")
            {
                if(!gameStarted){}
                BeedoGames.ProgressionBar.SetVisible(true);
                BeedoGames.LanguageManager.SetComponentVisible(COMPONENTs.DROP_DOWN,true);
            }
        }
        function onMatchEnded() {
            BeedoGames.onEvent(EVENTs.GAME_END);
            BeedoGames.ProgressionBar.SetVisible(false);
            BeedoGames.LanguageManager.SetComponentVisible(COMPONENTs.DROP_DOWN,false);
        }
        function Show_Ads()
        {
            BeedoGames.AdsManager.ShowInterstitial();
        }
        function isAdBlockerEnabled()
        {
            return BeedoGames.AdsManager.adBlocker?1:0;
        }
        function WatchRewardedVideoAd()
        {
            BeedoGames.AdsManager.ShowRewarded();
        }
        function HappyTime(intensity)
        {
            BeedoGames.onEvent(EVENTs.HAPPY_TIME,{intensity:intensity});
        }
        function Update_ProgressionBar(unitProgress)
        {
            BeedoGames.ProgressionBar.UpdateProgress(unitProgress);
        }
        function ShowTutoText(text) {
            BeedoGames.TutorialManager.ShowText(text,true,true);
        }
        function HideTutoText()
        {
            BeedoGames.TutorialManager.Hide();
        }
        function onLanguageSet(id) {
            if(BeedoGames.LanguageManager.langSelected!=id)
                BeedoGames.LanguageManager.SetLanguage(id,false);
        }
        function On_GameStarted(){
            onGameStarted();
        }
        function On_MatchStart() {
            onMatchStarted();
        }
        function On_MatchEnd() {
            onMatchEnded();
        }
        function IF_Initiate_InApp (id)
        {
            BeedoGames.InAppsManager.PurchaseItem(id);
        }
        </script>
</head>
