<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lopez-fd/command-line@a1b4deaab3fbe9e0891f46a4432bc547c2f92ccd/src/TD/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lopez-fd/command-line@a1b4deaab3fbe9e0891f46a4432bc547c2f92ccd/src/Data/style.css">
  <script src="https://cdn.jsdelivr.net/gh/lopez-fd/command-line@a1b4deaab3fbe9e0891f46a4432bc547c2f92ccd/src/TD/gpu.js"></script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100%;
    }

    #unity-canvas {
      aspect-ratio: 16 / 9;
      object-fit: contain;
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
    }
  </style>
</head>

<body class="dark">
  <div id="unity-container" class="unity-desktop">
    <canvas id="unity-canvas"></canvas>
  </div>
  <div id="loading-cover" style="display:none;">
    <div id="unity-loading-bar">
      <div id="unity-logo"><img src="https://cdn.jsdelivr.net/gh/lopez-fd/command-line@a1b4deaab3fbe9e0891f46a4432bc547c2f92ccd/src/logo.png"></div>
      <div id="unity-progress-bar-empty" style="display: none;">
        <div id="unity-progress-bar-full"></div>
      </div>
      <div class="spinner"></div>
    </div>
  </div>
  
  <div id="eccentric-app">
  </div>

  <script src="https://cdn.jsdelivr.net/gh/lopez-fd/command-line@a1b4deaab3fbe9e0891f46a4432bc547c2f92ccd/src/Data/script.js"></script>
  <script>
const muteConsole = true;
if (muteConsole) { console.log = console.warn = console.error = console.info = console.debug = ()=>{}; }

    const projectId = "25933";
    const publicToken = "Uj44zLTUbuk0Zo7wnEn9IIStAysJhkND";
    const russianName = "";
    const englishName = "";
    const isAspectRationVertical = "";
    const overlayBackgroundColor = "";
    const progressBarFillColor = "";
    const progressBarBackgroundColor = "";
    const progressBarBorderColor = "";
    const autocallGameReady = "";


  var _unityAwaiter = {};
  _unityAwaiter.ready = new Promise((resolve, reject) => {
    _unityAwaiter.done = resolve;
    _unityAwaiter.abort = reject;
  });

  var _gpAwaiter = {};
  _gpAwaiter.ready = new Promise((resolve) => {
    _gpAwaiter.done = resolve;
  });

  window.unityInstance = null;
  window.onGPError = async () => {
    _gpAwaiter.done();
    await _unityAwaiter.ready;
    window.unityInstance.SendMessage('GamePushSDK', 'CallOnSDKError');
  }

  let gamePushInstance = null;
  
  window.onGPInit = async (gp) => {
    gamePushInstance = gp;

    if (gp.platform.type !== "CRAZY_GAMES"){
      gp.ads.showPreloader();
    }

    let logoHtml = null;
    if (russianName !== "" || englishName !== ""){
      if (gp.language === "ru"){
        logoHtml = `<div id="unity-name">${russianName}</div>`;
      }
      else {
        logoHtml = `<div id="unity-name">${englishName}</div>`;
      }
    }
    else {
      logoHtml = `<img src="https://cdn.jsdelivr.net/gh/lopez-fd/command-line@a1b4deaab3fbe9e0891f46a4432bc547c2f92ccd/src/logo.png">`;
    }
    let logo = document.querySelector("#unity-logo");
    logo.innerHTML = logoHtml;

    window.GamePush = new GamePushUnity(gp);
    gp.player.ready.finally(_gpAwaiter.done);
    
    await _unityAwaiter.ready;
    await _gpAwaiter.done;
    window.unityInstance.SendMessage('GamePushSDK', 'CallOnSDKReady');

    if (autocallGameReady != null && parseFloat(autocallGameReady) > 0) {
      setTimeout(() => gp.gameStart(), parseFloat(autocallGameReady));
    }
  };

  ((g, a, m, e) => { 
    let o = () => { 
      let p = document.createElement("script"); 
      p.src = `${a[0]}?projectId=${m}&publicToken=${e}`, 
      p.onerror = () => { 
        a.shift(), 
        a.length > 0 ? (o(), 
        p.remove()) : "onGPError" in g && g.onGPError() }, 
        document.head.appendChild(p) 
      }; 
      o() 
    })(window, ["https://cdn.jsdelivr.net/gh/lopez-fd/command-line@fe704f88df574abadd52ed61c232b69ac4101f8d/src/temp.js"], 
    projectId, 
    publicToken);


    const buildUrl = "https://cdn.jsdelivr.net/gh/lopez-fd/command-line@a1b4deaab3fbe9e0891f46a4432bc547c2f92ccd/src/B";
    const loaderUrl = buildUrl + "/loader.js";
    const config = {
      dataUrl: buildUrl + "/fra.data.unityweb",
      frameworkUrl: buildUrl +  "/ragf.js",
      codeUrl: buildUrl + "/fra.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "ragdoll-blade",
      productVersion: "1.0.0",
    };

    const container = document.querySelector("#unity-container");
    const canvas = document.querySelector("#unity-canvas");
    const loadingCover = document.querySelector("#loading-cover");
    const progressBarEmpty = document.querySelector("#unity-progress-bar-empty");
    const progressBarFull = document.querySelector("#unity-progress-bar-full");
    const spinner = document.querySelector('.spinner');

    if (overlayBackgroundColor !== "-" && overlayBackgroundColor !== " " && overlayBackgroundColor !== "")
      canvas.style.background = overlayBackgroundColor;

    if (progressBarFillColor !== "-" && progressBarFillColor !== " " && progressBarFillColor !== "")
      progressBarFull.style.background = progressBarFillColor;

    if (progressBarBackgroundColor !== "-" && progressBarBackgroundColor !== " " && progressBarBackgroundColor !== "")
      progressBarEmpty.style.background = progressBarBackgroundColor;

    if (progressBarBorderColor !== "-" && progressBarBorderColor !== " " && progressBarBorderColor !== "")
      progressBarEmpty.style.border.color = progressBarBorderColor;


    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      container.className = "unity-mobile";
    }

    loadingCover.style.display = "";
    let UnityInstance = null;
    const unityLoader = document.createElement("script");
    unityLoader.src = loaderUrl;
    unityLoader.onload = async () => {
      await _gpAwaiter.ready;
      createUnityInstance(canvas, config, (progress) => {
        spinner.style.display = "none";
        progressBarEmpty.style.display = "";
        progressBarFull.style.width = `${100 * progress}%`;
      }).then((unityInstance) => {
        UnityInstance = unityInstance;
        window.unityInstance = unityInstance;
        _unityAwaiter.done(unityInstance);
        loadingCover.style.display = "none";
      }).catch((message) => {
        _unityAwaiter.abort(message);
        alert(message);
      });
    };
    document.body.appendChild(unityLoader);

    document.addEventListener("pointerdown", () => {
      container.focus();
      window.focus();
      canvas.focus();
    });

    document.addEventListener("contextmenu", (event) => {
      event.preventDefault()});

    if (isAspectRationVertical === 'true') {
      canvas.style.aspectRatio = '9 / 16';
    } else {
      canvas.style.aspectRatio = '16 / 9';
    }
    canvas.style.backgroundSize = 'cover';

  </script>
</body>

</html>
