<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html" charset="utf-8"/>
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1, maximum-scale=1, user-scalable=no">
    <title>My Tiny Market</title>
    <style>
        html, body {
            overflow: hidden;
            width   : 100%;
            height  : 100%;
            margin  : 0;
            padding : 0;

            -webkit-touch-callout: none !important;                 
            -webkit-text-size-adjust: none !important;              
            -webkit-user-select: none !important;                   
        }

        #renderCanvas {
            width   : 100%;
            height  : 100%;
            overflow: hidden;
            margin: 0;
            padding: 0;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            border: none;
        }
    </style>
<script type="text/javascript">
const muteConsole = true;
if (muteConsole) { console.log = console.warn = console.error = console.info = console.debug = ()=>{}; }
</script><script>
  window.addEventListener("keydown", function(e) {
      if(["Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].indexOf(e.code) > -1) {
          e.preventDefault();
      }
  }, false);
</script>
</head>

<body>
    <script src="https://cdn.jsdelivr.net/gh/maureenbev/mid-function@ef0dd4e6009e75d52b7bad6b1f7c52348c344fc5/data/js/lib/babylon.js"></script>

    <script src="https://cdn.jsdelivr.net/gh/maureenbev/mid-function@ef0dd4e6009e75d52b7bad6b1f7c52348c344fc5/data/js/lib/babylonjs.loaders.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/maureenbev/mid-function@ef0dd4e6009e75d52b7bad6b1f7c52348c344fc5/data/js/lib/polyfill.min.js"></script>
    <input id="keyboard_hide_input" type="hidden">
    <canvas id="renderCanvas" touch-action="none"></canvas>
    <script src="https://cdn.jsdelivr.net/gh/maureenbev/mid-function@88eed3d03acc756c90a42b5bd938a816106fd1fb/data/js/gm.js"></script>
    <div id="ads"></div>
    <script src="https://cdn.jsdelivr.net/gh/st39/sdk@main/api.js"></script>
</body>
</html>
