<!DOCTYPE html><html lang="en-us"><head><meta charset="utf-8"><meta http-equiv="Content-Type" content="text/html; charset=utf-8"><style>body,html{width:100%;height:100%;padding:0;margin:0}.fullscreen-canvas{background:#242424;width:100%;height:100%;position:absolute;top:0;left:0}</style>

<script>

Element.prototype.requestPointerLock=function(){return Promise.resolve();};

document.exitPointerLock=function(){};

const spoof={userAgent:"Mozilla/5.0 (Linux; Android 13; Mobile)",maxTouchPoints:5};

for(let k in spoof)Object.defineProperty(navigator,k,{get:()=>spoof[k],configurable:!0});

if(typeof window.ontouchstart==='undefined')window.ontouchstart=function(){};

let activeTouches=new Map();

function dispatchTouch(type,canvas){

  let touches=[],changed=[];

  activeTouches.forEach((tData,id)=>{

    let t=new Touch({

      identifier:id,target:canvas,

      clientX:tData.x,clientY:tData.y,

      screenX:tData.x,screenY:tData.y,

      pageX:tData.x,pageY:tData.y,

      radiusX:1,radiusY:1,force:1

    });

    if(tData.state==='changed')changed.push(t);

    if(tData.state!=='ended')touches.push(t);

  });

  if(changed.length>0){

    try{

      canvas.dispatchEvent(new TouchEvent(type,{bubbles:!0,cancelable:!0,touches:touches,targetTouches:touches,changedTouches:changed}));

    }catch(e){}

  }

}

window.addEventListener('mousedown',e=>{

  if(!e.isTrusted)return;

  e.preventDefault();e.stopPropagation();

  let canvas=document.querySelector('canvas')||document.body;

  window.focus();

  if(canvas&&typeof canvas.focus==='function')canvas.focus();

  let id=e.button===2?1:0,x=e.clientX,y=e.clientY;

  if(id===1){

    let rect=canvas.getBoundingClientRect();

    x=rect.left+(rect.width*0.75);y=rect.top+(rect.height*0.5);

  }

  activeTouches.set(id,{x:x,y:y,state:'changed'});

  dispatchTouch('touchstart',canvas);

  activeTouches.get(id).state='active';

},!0);

window.addEventListener('mousemove',e=>{

  if(!e.isTrusted)return;

  e.preventDefault();e.stopPropagation();

  let canvas=document.querySelector('canvas')||document.body;

  let moved=!1;

  if(activeTouches.has(1)){

    let t=activeTouches.get(1);

    t.x+=e.movementX;t.y+=e.movementY;t.state='changed';

    moved=!0;

  }

  if(moved){

    dispatchTouch('touchmove',canvas);

    activeTouches.forEach(t=>t.state='active');

  }

},!0);

window.addEventListener('mouseup',e=>{

  if(!e.isTrusted)return;

  e.preventDefault();e.stopPropagation();

  let canvas=document.querySelector('canvas')||document.body;

  let id=e.button===2?1:0;

  if(activeTouches.has(id)){

    activeTouches.get(id).state='changed';

    dispatchTouch('touchend',canvas);

    activeTouches.delete(id);

  }

},!0);

window.addEventListener('blur',()=>{

  let canvas=document.querySelector('canvas')||document.body;

  activeTouches.forEach(t=>t.state='changed');

  if(activeTouches.size>0)dispatchTouch('touchend',canvas);

  activeTouches.clear();

});

window.addEventListener('contextmenu',e=>e.preventDefault(),!0);

</script>
