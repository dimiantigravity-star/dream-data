<script type="text/javascript">

    var DEFAULT_PROGRESS = {};

    DEFAULT_PROGRESS["sound"] = 1;

    DEFAULT_PROGRESS["music"] = 1;

    DEFAULT_PROGRESS["coins"] = 10;

    DEFAULT_PROGRESS["max_level"] = 0;

    DEFAULT_PROGRESS["skin"] = 0;

    DEFAULT_PROGRESS["characters"] = '';

    DEFAULT_PROGRESS["free_coins"] = -1;

    DEFAULT_PROGRESS["lang"] = "en";

    var gameSettings = {

        platform:PLATFORMs.PLAY_GAMA,

        platformParams:{},

        gameEngine:GAME_ENGINEs.CONSTRUCT_2,

        defaultProgress:DEFAULT_PROGRESS,

        canvas:

        {

            width:1920,

            height:1080,

            rescaleMode:RESCALE_MODEs.MIN,

            orientation:ORIENTATIONs.LANDSCAPE

        },

        storage: {

            prefix:"sh_"

        },

        loading:

        {

            spinner:

            {

                type:SPINNERs.DEFAULT,

                domId:"bg_loading_spinner_dom",

                hideOn:"loading_start"

            },

            bar:

            {

                type:LOADING_BARs.DEFAULT,

                domId:"bg_loading_bar_dom",

                frameHeight:"22px",

                barImage:"linear-gradient(to bottom, rgba(255,255,255,1) 0%,rgba(255,255,255,1) 100%)"

            }

        },

        ads:{},

        localization:

        {

            langs: ["en","fr","es","it","pt","de","zh","ru"],

            dropDown:

            {

                domId:"bg_lang_dropdown_dom"

            }

        }

    };

    var GameFunctions = {

        getCustomHTML:function(event)

        {

            addHTML = '';

            return addHTML;

        },

        FetchDomElements:function()

        {

        },

        onLoadingStarted:function()

        {

            BeedoGames.onGameFunctionsCallable();

        },

        onGameProgress(progress)

        {

            if(!FLAGs.NAV_LANG_UPDATED)

            {

                FLAGs.NAV_LANG_UPDATED = true;

                c3_callFunction("Set_NavLang",[userLang]);

            }

        },

        onLoadingEnded:function()

        {

            BeedoGames.LoaderManager.SetComponentVisible(COMPONENTs.LOADING_SPINNER,false,true);

        },

        onGameReady:function() {

            // body...

        },

        onPageReady:function()

        {



        },

        Resize:function()

        {



        },

        SendInitialProgressToGame: function()

        {

            if(!FLAGs.NAV_LANG_UPDATED)

            {

                FLAGs.NAV_LANG_UPDATED = true;

                c3_callFunction("Set_NavLang",[userLang]);

            }

            var progress = [];

            Object.entries(userProgress).forEach(([key, value]) => {

                progress.push(value);

            });

            c3_callFunction("On_ProfileRetrieved", progress);

        },

        onInterstitialAdEnded:function(status)

        {

            c3_callFunction("On_Ad_Served");

        },

        onRewardedAdEnded:function(status)

        {

            if(status==AD_STATUS.COMPLETED)

            {

                c3_callFunction("On_RewardedAd_Served");

            }

            else

            {

                c3_callFunction("On_RewardedAd_Closed");

            }

        },

        PlayAudio:function(id)

        {

            if(gameScene!=""){c3_callFunction("Play_UISound",["click_0"]);}

        },

        onLanguageSelected:function()

        {

            if(gameScene!=""){c3_callFunction("Play_UISound",["click_0"]);}

        },

        onLanguageUpdated:function(lang)

        {

            if(gameScene!=""){c3_callFunction("Set_Language",[lang]);}

        },

        onSDKEvent:function(event)

        {

            switch(event)

            {

                case "GAME_PAUSE":

                break;

                case "SUSPEND":

                if(FLAGs.GAME_FUNCTIONS_CALLABLE){c3_callFunction("IF_FreezeGame");}

                break;

                case "RESUME":

                if(FLAGs.GAME_FUNCTIONS_CALLABLE){c3_callFunction("IF_UnFreezeGame");}

                break;

                case "ON_AUDIO_SUSPEND":

                if(FLAGs.GAME_FUNCTIONS_CALLABLE){c3_callFunction("IF_MuteAudio");}

                break;

                case "ON_AUDIO_RESUME":

                if(FLAGs.GAME_FUNCTIONS_CALLABLE){c3_callFunction("IF_UnMuteAudio");}

                break;

            }

        },

        onInAppsReady:function(){

            c3_callFunction("Enable_InApps");

            if(BeedoGames.InAppsManager.params.priceTexts){

                c3_callFunction("On_InApp_Prices",[BeedoGames.InAppsManager.params.priceTexts]);

            }

        },

        onInAppsDisabled:function(){c3_callFunction("Disable_InApps");},

        onInAppStatus:function(id,success){

            if(success){c3_callFunction("On_InApp_Success",[id]);}

            else{c3_callFunction("On_InApp_Failed");}

        },

        onInAppConsumed:function(id,success){

            c3_callFunction("On_InApp_Consumed",[id,success?1:0]);

        },

        onPurchasesReady:function(key){

            c3_callFunction("Set_PendingInApps",[key]);

        }

    };

    BeedoGames.Init(gameSettings);

    function SaveProp(id, value)

    {

        BeedoGames.ProfileManager.SetItem(id,value);

    }

    const MODULEs = {

        Analytics : false

    }

    var gameScene = "";

    function onSceneLoaded (sceneName)

    {

        var displayBar = false;

        gameScene = sceneName;

        switch(gameScene)

        {

            case "loaderlayout":

            break;



            case "uilayout":

            displayBar = true;

            break;

        }

        if(gameScene!="loaderlayout")

        {

            if(!FLAGs.GAME_READY){BeedoGames.onGameReady();}

        }

        if(displayBar)

        {

            BeedoGames.LanguageManager.SetComponentVisible(COMPONENTs.DROP_DOWN,true);

        }

        else

        {

            BeedoGames.LanguageManager.SetComponentVisible(COMPONENTs.DROP_DOWN,false);

        }

    }

    function On_GameLoadingStart()

    {

        if(!FLAGs.LOADING_STARTED){BeedoGames.LoaderManager.onLoadingStarted();}

        BeedoGames.LoaderManager.SetComponentVisible(COMPONENTs.LOADING_SPINNER,false,true);

    }

    function Update_LoadingProgress(progress)

    {

        if(!FLAGs.LOADING_STARTED){BeedoGames.LoaderManager.onLoadingStarted();}

        BeedoGames.LoaderManager.onGameProgress(progress);

    }

    function onGameStarted()

    {

        BeedoGames.LoaderManager.SetComponentVisible(COMPONENTs.LOADING_SPINNER,false,true);

    }

    function onGameSeqUpdated (seq)

    {

        if(gameScene=="uilayout")

        {

            if(seq==0)

            {

                BeedoGames.LanguageManager.SetComponentVisible(COMPONENTs.DROP_DOWN,true);

            }

            else

            {

                BeedoGames.LanguageManager.SetComponentVisible(COMPONENTs.DROP_DOWN,false);

            }

        }

    }

    function onUserProgressUpdate(argument) {

        // body...

    }

    function onMatchStarted() {

        BeedoGames.onEvent(EVENTs.GAME_START);

    }

    function onMatchEnded() {

        BeedoGames.onEvent(EVENTs.GAME_END);

    }

    function Show_Ads()

    {

        BeedoGames.AdsManager.ShowInterstitial();

    }

    function HappyTime(intensity)

    {

        if(!intensity){intensity=1;}

        BeedoGames.onEvent(EVENTs.HAPPY_TIME,{intensity:intensity});

    }

    function isAdBlockerEnabled()

    {

        return BeedoGames.AdsManager.adBlocker?1:0;

    }

    function WatchRewardedVideoAd()

    {

        BeedoGames.AdsManager.ShowRewarded();

    }

    function IF_AnalyticsUpdate(event,paramA,paramB,paramC){

        return;

    }

    function IF_Initiate_InApp (id)

    {

        BeedoGames.InAppsManager.PurchaseItem(id);

    }

    function IF_Consume_InApp(id)

    {

        BeedoGames.InAppsManager.ConsumeInApp(id);

    }

    function onLanguageSet(id) 

    {

        BeedoGames.LanguageManager.SetLanguage(id);

    }

</script>
