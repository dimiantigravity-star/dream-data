    <script type="module" src="https://cdn.jsdelivr.net/gh/Safgiy/reactsample@9abc3f8b96d9d560d3b10cc0e348a61b25a5ef7f/src/main/index.js"></script>

    <script type="module">

        const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":11095188},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4}

        const ENGINE = new Engine(GODOT_CONFIG)

        const CANVAS = document.getElementById('canvas')

        await load_b()

        window.bridge.engine = 'godot-4'

        window.bridge.initialize().then(() => {

            window.bridge.setGameLoadingProgress(0)

            ENGINE.startGame({

                onProgress: function (current, total) {

                    let expectedTotal = total > 0 ? total : 7510688;

                    let percent = (current / expectedTotal) * 100;

                    if (percent > 100) percent = 100;

                    

                    window.bridge.setGameLoadingProgress(percent);

                },

            }).then(() => {

                window.bridge.setGameLoadingProgress(100);

                CANVAS.focus();

            });

        })

    </script>
